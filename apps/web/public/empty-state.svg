<svg width="320" height="260" viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="docGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4F3EF"/>
      <stop offset="100%" stop-color="#E9E7E0"/>
    </linearGradient>
  </defs>

  <!-- backdrop circle -->
  <circle cx="160" cy="130" r="92" fill="#F2F1EC"/>

  <!-- dashed ring -->
  <circle cx="160" cy="130" r="108" fill="none" stroke="#DAD8CF" stroke-width="2" stroke-dasharray="4 8"/>

  <!-- back document -->
  <rect x="104" y="70" width="88" height="110" rx="10" fill="#E4E2DA" transform="rotate(-6 148 125)"/>

  <!-- front document -->
  <rect x="118" y="64" width="96" height="120" rx="10" fill="url(#docGrad)" stroke="#D7D5CC" stroke-width="1.5"/>

  <!-- document lines -->
  <rect x="134" y="88" width="64" height="7" rx="3.5" fill="#CFCDC3"/>
  <rect x="134" y="104" width="64" height="7" rx="3.5" fill="#DAD8CF"/>
  <rect x="134" y="120" width="40" height="7" rx="3.5" fill="#DAD8CF"/>

  <!-- folded corner -->
  <path d="M198 64 L214 84 L198 84 Z" fill="#D7D5CC"/>

  <!-- magnifier -->
  <g transform="translate(176 150)">
    <circle cx="20" cy="20" r="20" fill="#FFFFFF" stroke="#C9C7BC" stroke-width="3"/>
    <line x1="35" y1="35" x2="50" y2="50" stroke="#C9C7BC" stroke-width="5" stroke-linecap="round"/>
    <path d="M12 20a8 8 0 0 1 8-8" stroke="#E4E2DA" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- small dots for texture -->
  <circle cx="70" cy="90" r="4" fill="#E4E2DA"/>
  <circle cx="252" cy="110" r="5" fill="#E4E2DA"/>
  <circle cx="246" cy="180" r="3.5" fill="#DAD8CF"/>
  <circle cx="86" cy="196" r="3.5" fill="#DAD8CF"/>
</svg>
